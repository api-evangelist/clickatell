openapi: 3.2.0
info:
  title: One API
  version: 1.0.0
  x-provenance:
    method: searched
    source: https://help.clickatell.com/developers-api-reference/ (OpenAPI fragments embedded verbatim in the GitBook .md twins, merged by info.title)
    generated: '2026-10-13'
servers:
- url: https://platform.clickatell.com
security:
- api-key: []
tags:
- name: One API
paths:
  /v1/message/{omniMessageId}:
    get:
      tags:
      - One API
      summary: Query status of a message
      description: 'Response will contain status information for any channel relevant to the message.


        The timestamp field indicates the time of the last status change.


        If the message is in an unknown state (message not found), the format is different (since there is no channel) and the timestamp should be set to the current time as it is presently unknown at the time of the request.'
      operationId: messageStatus
      parameters:
      - name: omniMessageId
        in: path
        description: Omni message id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniMessageStatusResponse'
        '404':
          description: Account not found
  /v1/message:
    post:
      tags:
      - One API
      summary: Send one or more messages
      description: 'Note that on message send responses, there are two possible locations for error information: one for global level (where entire payload is rejected) and one where a message level reject is applicable.


        Errors Table

        Message Status Table

        Supported content types and limitations'
      operationId: sendMessages
      parameters: []
      requestBody:
        description: Send message/messages request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOmniChannelMessagesRequest'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniMessageListResponse'
        '207':
          description: 'Returned on a message when more than one message was submitted, but they have a different status (example: one message was accepted, and one was rejected'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniMessageListResponse'
        '400':
          description: Bad Request. Note that the global error object is not used because this is a message-level error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniMessageListResponse'
        '401':
          description: Unauthorized
          content:
            application/json: {}
        '402':
          description: Payment Required. User is out of funds/credits/currency/balance
        '404':
          description: Request was sent to a resource that does not exist
        '503':
          description: Service Unavailable
  /v1/notification:
    post:
      tags:
      - One API
      summary: Send Business Read status notification
      operationId: sendBusinessStatusNotification
      parameters: []
      requestBody:
        description: Send business status notification/notifications request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyStatusNotificationRequest'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppNotificationListResponse'
        '207':
          description: 'Returned on a request when more than one notification was submitted, but they have a different status (example: one notification was accepted, and one was rejected'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppNotificationListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppNotificationListResponse'
        '401':
          description: Unauthorized
          content:
            application/json: {}
        '404':
          description: Request was sent to a resource that does not exist
        '503':
          description: Service Unavailable
  /v1/media/{fileId}:
    get:
      tags:
      - One API
      summary: Get media file metadata
      description: Response returns metadata of uploaded media
      operationId: getMetadata
      parameters:
      - name: fileId
        in: path
        description: ID of the file that was returned in media upload request
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFileMetadataResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniMediaUploadResponse'
        '404':
          description: Account/file not found
  /v1/media:
    get:
      tags:
      - One API
      summary: Media Download
      description: 'Media file will be available for download for 30 days


        The response body will contain:


        the binary media data if it is not client side encrypted


        the encrypted binary media data if client side encrypted


        The download URL is specified in the moMedia event in the downloadUrl parameter of the files object array'
      operationId: downloadFile
      parameters:
      - name: fileId
        in: query
        description: ID of the file that is presented in MO Callbacks
        required: true
        schema:
          type: string
      - name: source
        in: query
        description: If encryption is client, value should be 'client'
        schema:
          type: string
          enum:
          - client
      - name: sha256Hash
        in: query
        description: Hash of file that is presented in MO Callbacks
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OmniMediaUploadResponse'
        '404':
          description: Account/file not found
    post:
      tags:
      - One API
      summary: Upload media file for One Api
      description: 'Uploaded media file will be available for message sending for 30 days after uploading


        The body must contain the binary media data


        Media size limit is 30MB


        Supported content types and limitations'
      operationId: uploadFile
      parameters:
      - name: to
        in: query
        description: 'Field that marks this upload file for delivery to a single destination user. Limits message sending to only this number '
        schema:
          type: string
      - name: broadcastAllowed
        in: query
        description: <ul> <li>Field that marks this upload file for delivery to any destination users.</li> <li>Value must be set to true</li> <li>Broadcasts for media and interactive media templates are supported.</li> <li><b>Note:</b> The above is dependent on terms and conditions and best practices as prescribed by Meta.</b></li>
        schema:
          type: boolean
      - name: fileName
        in: query
        description: File name of the file being uploaded
        required: true
        schema:
          type: string
      - name: encryptionKey
        in: query
        schema:
          type: string
      - name: kmsArn
        in: query
        schema:
          type: string
      - name: encryptionCipher
        in: query
        schema:
          type: string
      - name: sha256FileHash
        in: query
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Content type of file
        required: true
        schema:
          type: string
      requestBody:
        description: Send message/messages request
        content:
          '*/*':
            schema:
              type: object
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniMediaUploadResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniMediaUploadResponse'
        '404':
          description: Account not found
  /v1/balance:
    get:
      tags:
      - One API
      summary: Return information about account balance
      operationId: accountMessagingBalance
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagingBalanceResponse'
        '404':
          description: Account not found
components:
  schemas:
    OmniMessagesResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/OmniResponseError'
        apiMessageId:
          type: string
          description: System defined message ID.
        accepted:
          type: boolean
          description: Indication if the message has passed API validation
        to:
          type: string
          description: Recipient of the message, echoed back exactly as submitted. For WhatsApp this is a BSUID if a BSUID was submitted.
        clientMessageId:
          type: string
          description: Customer defined message ID for tracking purposes.
    WhatsAppInteractiveMessageHeader:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: Indicates the header type<br>
          enum:
          - text
          - media
        text:
          maximum: 60
          type: string
          description: Required, if type text<br><b>Note:</b> Does not allow markdown
        media:
          $ref: '#/components/schemas/WhatsAppInteractiveMessageMedia'
      description: Header content displayed on top of a message.
    WhatsAppTemplateHeaderText:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties:
            type: string
            description: Key value pairs; key is string numeric value parameter and value set to the parameter value WhatsApp currently only allows for a single parameter value in the header text. <br><b>Only required if the template was created with a variable in the header text</b>
          description: Key value pairs; key is string numeric value parameter and value set to the parameter value WhatsApp currently only allows for a single parameter value in the header text. <br><b>Only required if the template was created with a variable in the header text</b>
      description: Required, if type text
    OmniMessageStatusResponse:
      type: object
      properties:
        sms:
          $ref: '#/components/schemas/OmniMessageStatusEntry'
        whatsapp:
          $ref: '#/components/schemas/OmniMessageStatusEntry'
    WhatsAppContact:
      required:
      - name
      type: object
      properties:
        addresses:
          minItems: 1
          type: array
          description: 'List of address object. See request example WhatsApp Contacts: One message'
          items:
            type: object
            additionalProperties:
              type: string
        birthday:
          pattern: YYYY-MM-DD
          type: string
          description: String date value.
        emails:
          minItems: 1
          type: array
          description: 'List of the email object. See request example WhatsApp Contacts: One message'
          items:
            type: object
            additionalProperties:
              type: string
        name:
          type: object
          additionalProperties:
            type: string
            description: 'Name object. See request example WhatsApp Contacts: One message'
          description: 'Name object. See request example WhatsApp Contacts: One message'
        origin:
          type: string
          description: <b>WhatsApp inbound only</b><br>Indicates how the contact was shared by the user. <i>contact_request</i> means the contact was shared in direct response to a REQUEST_CONTACT_INFO button; <i>other</i> means the contact was shared organically (e.g. a forwarded vCard). Present only on inbound contact messages when supplied by WhatsApp; omitted when absent. Not encrypted for client-side encryption.
          enum:
          - contact_request
          - other
        org:
          type: object
          additionalProperties:
            type: string
            description: 'See request example WhatsApp Contacts: One message'
          description: 'See request example WhatsApp Contacts: One message'
        phones:
          minItems: 1
          type: array
          description: 'List of the phone object. See request example WhatsApp Contacts: One message'
          items:
            type: object
            additionalProperties:
              type: string
        urls:
          minItems: 1
          type: array
          description: 'List of the url object. See request example WhatsApp Contacts: One message'
          items:
            type: object
            additionalProperties:
              type: string
    WhatsAppMessageTemplateBody:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties:
            type: string
            description: Key value pairs; key is string numeric value parameter and value set to the parameter value
          description: Key value pairs; key is string numeric value parameter and value set to the parameter value
      description: Body object.
    MediaFileMetadataResponse:
      type: object
      properties:
        expirationTime:
          type: integer
          format: int64
        broadcastAllowed:
          type: boolean
    OmniIntegrationWaMediaRequest:
      type: object
      properties:
        contentType:
          type: string
          description: Media type header for file format and file content. This parameter is required when sending a media message.<br><b>Inline required.</b>
        caption:
          type: string
          description: This is an optional parameter and may be used to describe the media file being sent. Do not use when sending audio media.
        fileName:
          type: string
          description: This is an optional parameter and may be used to specify name of a file that is sent to WhatsApp.
        sha256Hash:
          type: string
          description: SHA256 File hash of the unencrypted file content.
        fileId:
          type: string
          description: File reference id as returned in the media file upload API call.<br><b>By Reference required.</b>
      description: <b>WhatsApp only</b><br>Object containing parameters for sending a media message.
    WhatsAppTemplateHeaderMedia:
      required:
      - fileId
      type: object
      properties:
        fileId:
          type: string
          description: <i>fileId</i> as returned in the api reponse of the media upload request (see <i>Upload Media file for One Api</i>). <br>WhatsApp allows files of type image, video and document.
      description: Required, if type media
    WhatsAppMessageTemplateHeader:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: Indicates the header type of the template.<br><b>Note:</b><i> location</i> header type (location template) only supported for cloud-hosted numbers
          enum:
          - text
          - media
          - location
        text:
          $ref: '#/components/schemas/WhatsAppTemplateHeaderText'
        media:
          $ref: '#/components/schemas/WhatsAppTemplateHeaderMedia'
        location:
          $ref: '#/components/schemas/WhatsAppTemplateHeaderLocation'
      description: Template header.
    WhatsAppMessageListSection:
      type: object
      properties:
        items:
          maxItems: 10
          minItems: 1
          type: array
          description: Array of the section message object containing specific title fields for sending a list message. Max items in total is 10.
          items:
            $ref: '#/components/schemas/WhatsAppMessageListSectionItem'
        title:
          maximum: 24
          type: string
          description: Title of section<br><b>Note:</b> Does not allow markdown.<br>If more than one section is presented, this field is required.
    WhatsAppMessageList:
      required:
      - button
      - sections
      - subtitle
      type: object
      properties:
        sections:
          maxItems: 10
          minItems: 1
          type: array
          description: Array of the message objects containing items for sending a list message.
          items:
            $ref: '#/components/schemas/WhatsAppMessageListSection'
        title:
          maximum: 60
          type: string
          description: Title for the list picker message.<br><b>Note:</b> Does not allow markdown
        subtitle:
          maximum: 1024
          type: string
          description: Subtitle for the list picker message
        button:
          maximum: 20
          type: string
          description: Button name for the list picker message.<br><b>Note:</b> Does not allow markdown
        footer:
          maximum: 60
          type: string
      description: <b>WhatsApp only</b><br>Object containing parameter for sending a list message
    OmniMessageRequest:
      required:
      - to
      type: object
      properties:
        channel:
          type: string
          description: Specifies the channel to be used with the specified message.
          enum:
          - sms
          - whatsapp
        to:
          type: string
          description: 'Recipient of the message.<ul>

            <li><b>SMS</b> &ndash; MSISDN, international format, no leading +.</li>

            <li><b>WhatsApp</b> &ndash; MSISDN or BSUID (Business-Scoped User ID, format: CC.alphanumeric, max 131 chars). Both are accepted. Use the BSUID when you have one; use the MSISDN to reach a user for the first time, and for one-tap, zero-tap or copy-code authentication templates, which cannot be sent to a BSUID. See <i>WhatsApp recipient identifiers</i> in the API description.</li></ul>'
        content:
          minLength: 1
          type: string
          description: 'The string value contains actual message content. <br><b>Character set UTF-8</b><br>WhatsApp Inline Media: base64 encoded media data<br><b>Not required for media by reference message sending</b><br><br><b>Limit</b><ul><li>WhatsApp text: 4096 characters</li><li>WhatsApp media: 1MB (total 20MB payload limit)</li></ul>'
        clientMessageId:
          type: string
          description: Customer defined message ID for tracking purposes. Returned in callbacks and certain API submission formats.
        scheduledDeliveryTime:
          pattern: yyyy-MM-ddTHH:mm:ssXXX
          type: string
          description: Ability to schedule messages for later delivery.
        validityPeriod:
          type: integer
          description: The message will not be processed/queued/retried for a period exceeding the provided validity period. (In minutes)
          format: int32
          default: 1440
        previewFirstUrl:
          type: boolean
          description: <b>WhatsApp only</b><br>True or false - will indicate if URL link must display as preview on recipient phone. Only applicable when sending plain text messages.
        location:
          $ref: '#/components/schemas/Location'
        contacts:
          type: array
          description: <b>WhatsApp only</b><br>Array of the contact object containing parameters for sending a contacts message.<br><b>Note:</b><br> if contact object is presented, minimum requirement is the name parameter + at least one other parameter.
          items:
            $ref: '#/components/schemas/WhatsAppContact'
        media:
          $ref: '#/components/schemas/OmniIntegrationWaMediaRequest'
        template:
          $ref: '#/components/schemas/WhatsAppMessageTemplate'
        listPicker:
          $ref: '#/components/schemas/WhatsAppMessageList'
        button:
          $ref: '#/components/schemas/WhatsAppMessageButton'
        actionUrl:
          $ref: '#/components/schemas/WhatsAppMessageCTAButton'
        locationRequest:
          $ref: '#/components/schemas/WhatsAppMessageLocationRequest'
        from:
          type: string
          description: <b>Sms only</b><br>The two-way number that will be used for message delivery<br>from - Required Field for Two Way communication in the USA.
        userDataHeader:
          type: string
          description: <b>Sms only</b><br>UDH content of a message. It does not contain any text, but rather specifies how the message should be processed. Basically, it’s a part of the SMS which tells the receiving handset what type of message being sent.
        binary:
          type: boolean
          description: <b>Sms only</b><br>Specifies if <i>content</i> delivered by client needs to be in binary format.
        encryptionKey:
          type: string
          description: <b>Client side encryption ONLY</b><br>Base64 encoded encrypted data key as generated from AWS KMS. Note that MC2 will have to submit additional fields to SMS/WA adapter for client side encryption to work. For client side encrypted media by reference send message requests this field must be populated even if the media <i>caption</i> is null.
        encryptionKeyArn:
          type: string
          description: <b>Client side encryption ONLY</b><br>Customer defined encryption key ARN.
        encryptionCipher:
          type: string
          description: <b>Client side encryption ONLY</b><br>Customer defined encryption cipher.
    MessagingBalanceResponse:
      type: object
      properties:
        balance:
          type: number
        currency:
          type: string
    ReplyStatusNotificationRequest:
      required:
      - event
      type: object
      properties:
        event:
          $ref: '#/components/schemas/ReplyStatusEvent'
      description: Send Business Read Status notification request
    OmniMediaUploadResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/OmniResponseError'
        fileId:
          type: string
        accepted:
          type: boolean
    WhatsAppMessageTemplate:
      required:
      - templateName
      - body
      type: object
      properties:
        templateName:
          type: string
          description: Template name which was specified when created.
        language:
          type: string
          description: Specifies the language the template may be rendered in.
        header:
          $ref: '#/components/schemas/WhatsAppMessageTemplateHeader'
        body:
          $ref: '#/components/schemas/WhatsAppMessageTemplateBody'
        buttons:
          $ref: '#/components/schemas/WhatsAppMessageTemplateButtons'
        templateButtons:
          maxItems: 10
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppMixedTemplateButton'
          description: '<li>Suppports a combination of button types in a single WhatsApp message template.</li>  <li>All buttons of the same type must be grouped together, e.g., all “url” buttons, all “suggestedResponse” buttons, etc.</li>  <li><b>Note:</b> If a “phone” or “static URL” button is used in the template, their position (index) requires the “index” parameter of other buttons to be incremented accordingly.</li> <li>See Example: <i>WhatsApp Interactive Text Template with Mixed Buttons.</i></li>

            '
      description: <b>WhatsApp only</b><br>Object containing parameters for sending a template message.
    WhatsAppMixedTemplateButtonUrl:
      required:
      - index
      - type
      - url
      type: object
      properties:
        index:
          type: integer
          format: int32
          description: Index of button in template in order it was created, starts at 1
        type:
          type: string
          enum:
          - url
        url:
          type: object
          required:
          - url
          properties:
            url:
              type: string
              description: Enter final part of URL in this field (the first part is already specified in template).
    ReplyStatusUpdateNotification:
      required:
      - messageId
      - statusCode
      type: object
      properties:
        channel:
          type: string
          description: Supplier channel on which the inbound message to which this notification relates was received
          default: whatsapp
          enum:
          - whatsapp
        statusCode:
          type: integer
          description: Business acknowledges that it has read (seen) an inbound message from the user
          format: int32
          default: 1001
          enum:
          - 1001
        messageId:
          type: string
          description: MO message id of the message associated with this status update
        clientEventId:
          type: string
          description: Client internal id that the client can use to match the response to the request. This parameter will just be echoed back in the response.
    WhatsAppMessageCTAButton:
      required:
      - body
      - title
      - url
      type: object
      properties:
        body:
          maximum: 1024
          type: string
        header:
          $ref: '#/components/schemas/WhatsAppInteractiveMessageHeader'
        footer:
          maximum: 60
          type: string
        title:
          maximum: 20
          type: string
          description: Title that will be displayed on the button
        url:
          maximum: 2000
          type: string
          description: Url for CTA button
      description: <b>WhatsApp only</b><br>Object containing parameter for sending a button message
    ReplyStatusEvent:
      required:
      - messageStatusUpdate
      type: object
      properties:
        messageStatusUpdate:
          maxItems: 100
          minItems: 1
          type: array
          description: An array of one or more messages can be specified
          items:
            $ref: '#/components/schemas/ReplyStatusUpdateNotification'
      description: Business Read Status event request
    WhatsAppMixedTemplateButtonOtp:
      required:
      - index
      - type
      - otp
      type: object
      properties:
        index:
          type: integer
          format: int32
          description: Index of button in template in order it was created, starts at 1
        type:
          type: string
          enum:
          - otp
        otp:
          type: object
          required:
          - code
          properties:
            code:
              type: string
              description: OTP code value for authentication templates.
    WhatsAppInteractiveMessageMedia:
      required:
      - fileId
      - type
      type: object
      properties:
        type:
          type: string
          description: File type value.
          enum:
          - image
          - video
          - document
        fileId:
          type: string
          description: File reference id as returned in the media file upload API call.
      description: Required, if type media
    WhatsAppMixedTemplateButtonSuggestedResponse:
      required:
      - index
      - type
      - suggestedResponse
      type: object
      properties:
        index:
          type: integer
          format: int32
          description: Index of button in template in order it was created, starts at 1
        type:
          type: string
          enum:
          - suggestedResponse
        suggestedResponse:
          type: object
          required:
          - postbackData
          properties:
            postbackData:
              type: string
              description: This string will be passed back in response message if user taps this button.
    WhatsAppTemplateHeaderLocation:
      required:
      - address
      - latitude
      - longitude
      - name
      type: object
      properties:
        longitude:
          maximum: 180
          minimum: -180
          type: string
          description: Longitude of the location as a numeric string value.
        latitude:
          maximum: 90
          minimum: -90
          type: string
          description: Longitude of the location as a numeric string value.
        name:
          type: string
          description: Name of the location.
        address:
          type: string
          description: Address of the location. The address will only be displayed if the name was set.
      description: <b>Note:</b> <i>location</i> header only supported for cloud numbers. Required, if type location
    Location:
      required:
      - latitude
      - longitude
      type: object
      properties:
        longitude:
          maximum: 180
          minimum: -180
          type: string
          description: Longitude of the location as a numeric string value.
        latitude:
          maximum: 90
          minimum: -90
          type: string
          description: Longitude of the location as a numeric string value.
        name:
          type: string
          description: Name of the location.
        address:
          type: string
          description: Address of the location. The address will only be displayed if the name was set.
      description: <b>WhatsApp only</b><br>Object containing parameters for sending a location message.
    WhatsAppMessageLocationRequest:
      required:
      - body
      type: object
      properties:
        body:
          maximum: 1024
          type: string
          description: 'Whatsapp supports: emojis, markdown, links'
      description: <b>WhatsApp only</b> <br>Object for sending a location request message
    WhatsAppMessageListSectionItem:
      required:
      - postbackData
      - title
      type: object
      properties:
        title:
          maximum: 24
          type: string
          description: Title of item<br><b>Note:</b> Does not allow markdown
        subtitle:
          maximum: 72
          type: string
