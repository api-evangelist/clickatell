        caption:
          type: string
        files:
          type: array
          description: 'An array of the file object with a list of media items that is attached to the inbound media message. This parameter is only applicable to MO event callbacks for media by reference '
          items:
            $ref: '#/components/schemas/ReferenceMediaFile'
    WhatsAppContent:
      type: object
      properties:
        profileName:
          type: string
          description: Users profile name as set up on their WA Client
        referralInfo:
          $ref: '#/components/schemas/ReferralInfo'
        userId:
          type: string
          description: 'Business-Scoped User ID (BSUID) of the WhatsApp user. Format: CC.alphanumeric (max 131 chars). Always present for WhatsApp messages. Not encrypted for client-side encryption.'
        parentUserId:
          type: string
          description: 'Parent BSUID for linked business portfolios. Format: CC.ENT.alphanumeric (max 135 chars). Present only if your company is an eligible enterprise explicitly enrolled in a Parent BSUID account. Not encrypted for client-side encryption.'
        username:
          type: string
          description: WhatsApp username handle. Present only if the user has enabled a username. Encrypted for client-side encryption.
      description: WhatsApp specific content
