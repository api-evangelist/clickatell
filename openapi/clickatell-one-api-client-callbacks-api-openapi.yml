openapi: 3.2.0
info:
  title: One API Client Callbacks API
  version: 1.0.0
  x-provenance:
    method: searched
    source: https://help.clickatell.com/developers-api-reference/ (OpenAPI fragments embedded verbatim in the GitBook .md twins, merged by info.title)
    generated: '2026-10-13'
  description: 'Forward Compatibility

    While the basic callback structure will remain constant:


    {

    "integrationId": "string",

    "integrationName": "string",

    "event": {}

    }

    There are constant additions to channels including new features and message types, and Clickatell will be adding these to the callbacks as they become available.'
servers:
- url: http://customer-server/
  description: Customer server
  variables: {}
tags:
- name: One API Client Callbacks
  description: 'Forward Compatibility

    While the basic callback structure will remain constant:


    {

    "integrationId": "string",

    "integrationName": "string",

    "event": {}

    }

    There are constant additions to channels including new features and message types, and Clickatell will be adding these to the callbacks as they become available.'
paths:
  /client-callback/one-api-reply:
    post:
      tags:
      - One API Client Callbacks
      summary: Example of a customer's One Api reply callback
      operationId: sendPostOmniReplyCallback
      parameters: []
      requestBody:
        description: Reply request to client
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OmniReplyCallbackRequest'
      responses:
        '200':
          description: Success
  /client-callback/one-api-status:
    post:
      tags:
      - One API Client Callbacks
      summary: Example of a customer's One Api status callback
      operationId: sendPostOmniStatusCallback
      parameters: []
      requestBody:
        description: Status request to client
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OmniStatusCallbackRequest'
      responses:
        '200':
          description: Success
components:
  schemas:
    ButtonResponseReply:
      type: object
      properties:
        channel:
          type: string
          description: Specifies the channel which is used with the specified message
          enum:
          - sms
          - whatsapp
        messageId:
          type: string
          description: Id of a message that originated from client
        relatedMessageId:
          type: string
          description: Id of a message to which client responds
        relatedClientMessageId:
          type: string
          description: Id which was specified in <i>clientMessageId</i> field
        from:
          type: string
          description: 'Sender identifier. Phone number (international format, no leading +) or WhatsApp BSUID (Business-Scoped User ID, format: CC.alphanumeric, max 131 chars) for WhatsApp messages.'
        to:
          type: string
          description: Receiver phone number
        timestamp:
          type: integer
          description: Unix timestamp when the system received the message in milliseconds
          format: int64
        encryptionKey:
          type: string
          description: <b>Client side encryption ONLY</b><br>Base64 encoded CipherTextBlob which must be used to generate the plain text decryption key for decryption of the content parameter
        whatsapp:
          $ref: '#/components/schemas/WhatsAppContent'
        postbackData:
          type: string
        selectedItem:
          $ref: '#/components/schemas/SelectedButtonItem'
    LocationReply:
      type: object
      properties:
        channel:
          type: string
          description: Specifies the channel which is used with the specified message
          enum:
          - sms
          - whatsapp
        messageId:
          type: string
          description: Id of a message that originated from client
        relatedMessageId:
          type: string
          description: Id of a message to which client responds
        relatedClientMessageId:
          type: string
          description: Id which was specified in <i>clientMessageId</i> field
        from:
          type: string
          description: 'Sender identifier. Phone number (international format, no leading +) or WhatsApp BSUID (Business-Scoped User ID, format: CC.alphanumeric, max 131 chars) for WhatsApp messages.'
        to:
          type: string
          description: Receiver phone number
        timestamp:
          type: integer
          description: Unix timestamp when the system received the message in milliseconds
          format: int64
        encryptionKey:
          type: string
          description: <b>Client side encryption ONLY</b><br>Base64 encoded CipherTextBlob which must be used to generate the plain text decryption key for decryption of the content parameter
        whatsapp:
          $ref: '#/components/schemas/WhatsAppContent'
        charset:
          type: string
          description: Character encoding
          default: UTF-8
        locationAddress:
          type: string
          description: Address of the location
        locationName:
          type: string
          description: Name of the location
        latitude:
          type: string
          description: Numeric latitude value expressed as a string
        latitute:
          type: string
          description: Numeric latitude value expressed as a string
        longitude:
          type: string
          description: Numeric longitude value expressed as a string
    TypingStatus:
      type: object
      properties:
        channel:
          type: string
          enum:
          - sms
          - whatsapp
        timestamp:
          type: integer
          format: int64
        from:
          type: string
    MessageStatus:
      type: object
      properties:
        channel:
          type: string
          enum:
          - sms
          - whatsapp
        timestamp:
          type: integer
          format: int64
        statusCode:
          type: integer
          format: int32
        status:
          type: string
        messageId:
          type: string
        clientMessageId:
          type: string
    OmniReplyCallbackRequest:
      type: object
      properties:
        integrationId:
          type: string
        integrationName:
          type: string
        event:
          $ref: '#/components/schemas/ReplyEvents'
    ReferralInfo:
      type: object
      properties:
        headline:
          type: string
          description: Headline used in the ad that generated the message.
        content:
          type: string
          description: Body from the ad that generated the message.
        sourceType:
          type: string
          description: The type of the ad’s source.
          enum:
          - ad
          - post
        sourceId:
          type: string
          description: Facebook ID for an ad or a post.
        sourceUrl:
          type: string
          description: The url that leads to the ad or post. Opening this url takes you to the ad viewed by your user.
    ReferenceMediaReply:
      required:
      - files
      type: object
      properties:
        channel:
          type: string
          description: Specifies the channel which is used with the specified message
          enum:
          - sms
          - whatsapp
        messageId:
