      - $ref: '#/components/schemas/InlineMediaReply'
      - $ref: '#/components/schemas/ReferenceMediaReply'
    ReferenceMediaFile:
      required:
      - byteSize
      - contentType
      - downloadUrl
      type: object
      properties:
        contentType:
          type: string
          description: Media content type for the media item
        downloadUrl:
          type: string
          description: Download URL to be used for downloading the media item
        sha256Hash:
          type: string
        byteSize:
          type: integer
          description: Byte size of the file to be downloaded
          format: int64
        fileName:
          type: string
          description: Original file name (if it is available)
    FallbackStatus:
      type: object
      properties:
        channel:
          type: string
          enum:
          - sms
          - whatsapp
        timestamp:
          type: integer
          format: int64
        statusDescription:
          type: integer
          format: int32
        status:
          type: string
        messageId:
          type: string
        clientMessageId:
          type: string
    WhatsAppContact:
      required:
      - name
      type: object
      properties:
        addresses:
          minItems: 1
          type: array
          description: 'List of address object. See request example WhatsApp Contacts: One message'
          items:
            type: object
            additionalProperties:
              type: string
        birthday:
          pattern: YYYY-MM-DD
          type: string
          description: String date value.
        emails:
          minItems: 1
          type: array
          description: 'List of the email object. See request example WhatsApp Contacts: One message'
          items:
            type: object
            additionalProperties:
              type: string
        name:
          type: object
          additionalProperties:
            type: string
            description: 'Name object. See request example WhatsApp Contacts: One message'
          description: 'Name object. See request example WhatsApp Contacts: One message'
        origin:
          type: string
          description: <b>WhatsApp inbound only</b><br>Indicates how the contact was shared by the user. <i>contact_request</i> means the contact was shared in direct response to a REQUEST_CONTACT_INFO button; <i>other</i> means the contact was shared organically (e.g. a forwarded vCard). Present only on inbound contact messages when supplied by WhatsApp; omitted when absent. Not encrypted for client-side encryption.
          enum:
          - contact_request
          - other
        org:
          type: object
          additionalProperties:
            type: string
            description: 'See request example WhatsApp Contacts: One message'
          description: 'See request example WhatsApp Contacts: One message'
        phones:
          minItems: 1
          type: array
          description: 'List of the phone object. See request example WhatsApp Contacts: One message'
          items:
            type: object
            additionalProperties:
              type: string
        urls:
          minItems: 1
          type: array
          description: 'List of the url object. See request example WhatsApp Contacts: One message'
          items:
            type: object
            additionalProperties:
              type: string
